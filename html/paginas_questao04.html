<body>
    <div id="geral">
        <h3>4. Entrar com Nome, 3 notas de um aluno. Ache a média. Caso
            a média seja maior ou igual a 6, apresentar o texto
            Aprovado, caso contrário apresentar o texto Reprovado.</h3>

        <form id="formulario">
            <label for="nome" >Nome do Aluno </label>
            <input type="text" name="nome" id="nome">

            <label for="nota1" >Digite o valor da primeira nota: </label>
            <input type="text" name="nota1" id="nota1">

            <label for="nota2" >Digite o valor da segunda nota: </label>
            <input type="text" name="nota2" id="nota2">

            <label for="nota3" >Digite o valor da segunda nota: </label>
            <input type="text" name="nota3" id="nota3">

            <button type="submit"> Calcular </button>
            <button type="reset"> Limpar </button>


        </form>

        <div id="Resultado">

        </div>
    </div>
</body>
</html>
