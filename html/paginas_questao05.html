<body>
    <div id="geral">
        <h3>5. Escreva um programa que leia as medidas dos lados de um
            triângulo e escreva se ele é equilátero, isósceles ou
            escaleno. Sendo que:
        </h3>
            <h4>• Triângulo Equilátero: possui os 3 lados iguais.</h4>
            <h4>• Triângulo Isóscele: possui 2 lados iguais.</h4>
            <h4>• Triângulo Escaleno: possui 3 lados diferentes</h4>

        <form id="formulario">
            <label for="vert1" >Qual o valor da 1º vertice? </label>
            <input type="text" name="vert1" id="vert1">

            <label for="vert2" >Qual o valor da 2º vertice? </label>
            <input type="text" name="vert2" id="vert2">

            <label for="vert3" >Qual o valor da 3º vertice? </label>
            <input type="text" name="vert3" id="vert3">

            

            <button type="submit"> Calcular </button>
            <button type="reset"> Limpar </button>


        </form>

        <div id="Resultado">

        </div>
    </div>
</body>
