<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios</title>

<body>
    <div id="geral">
        <h2>3. O usuário deverá informar:</h2>
            <h4>● A distância a ser percorrida (em quilômetros);</h4>
            <h4>● O consumo médio do veículo (em km/l);</h4>
            <h4>● O preço do litro do combustível.</h4>

        <form id="formulario">
            <label for="distanciaKm" >Distância a ser pecorrida em Km</label>
            <input type="text" name="distanciaKm" id="distanciaKm">

            <label for="consumoMedio" >O consumo médio do veículo Km/l </label>
            <input type="text" name="consumoMedio" id="consumoMedio">

            <label for="precoLitro" >O preço do litro do combustível. </label>
            <input type="text" name="precoLitro" id="precoLitro">

            <button type="submit"> Calcular </button>
            <button type="reset"> Limpar </button>


        </form>

        <div id="Resultado">

        </div>
    </div>
</body>
</html>
